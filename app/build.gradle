plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.velora.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.velora.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.1.2"
    }

    // Signing config — values injected by CI via -P flags, or local keystore.properties
    def keystorePropertiesFile = rootProject.file("keystore.properties")
    def usePropertiesFile = keystorePropertiesFile.exists()
    def signingConfigured = usePropertiesFile ||
        (project.hasProperty('android.injected.signing.store.file'))

    if (usePropertiesFile) {
        def props = new Properties()
        props.load(new FileInputStream(keystorePropertiesFile))
        android.signingConfigs {
            release {
                storeFile     file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias      props['keyAlias']
                keyPassword   props['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            debuggable true
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (usePropertiesFile) {
                signingConfig signingConfigs.release
            }
            // When signing via -P flags (CI), Android plugin picks them up automatically
        }
    }

    lint {
        abortOnError false
        warningsAsErrors false
        disable 'AppLinkUrlError'
        htmlReport true
        textReport true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.10'
    }
}

dependencies {
    // Compose BOM
    implementation platform('androidx.compose:compose-bom:2024.02.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.activity:activity-compose:1.8.2'

    // Media3 / ExoPlayer
    implementation 'androidx.media3:media3-exoplayer:1.3.0'
    implementation 'androidx.media3:media3-ui:1.3.0'
    implementation 'androidx.media3:media3-session:1.3.0'
    implementation 'androidx.media3:media3-exoplayer-dash:1.3.0'

    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'

    // Core
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'

    // Coil for thumbnails
    implementation 'io.coil-kt:coil-compose:2.5.0'
    implementation 'io.coil-kt:coil-video:2.5.0'
    implementation 'androidx.palette:palette-ktx:1.0.0'

    // Pixel UI mode: squircle ("smooth corner") shapes + real Material You
    // (HCT/DynamicScheme) color generation, same libraries Pixel/PixelPlayer use.
    implementation 'com.github.racra:smooth-corner-rect-android-compose:v1.0.0'
    implementation 'com.google.android.material:material:1.12.0'
}

// Helper task so the workflow can read the version name
tasks.register('printVersionName') {
    doLast {
        println android.defaultConfig.versionName
    }
}
