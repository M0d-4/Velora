name: Velora CI/CD

# ─────────────────────────────────────────────────────────────────────────────
# TRIGGER SUMMARY
#
# Push to main/develop        → lint + test + build SIGNED release APK + publish BETA pre-release
# Pull request to main        → lint + test + build debug APK only (no publish)
# workflow_dispatch (manual)  → lint + test + build SIGNED release APK + AAB + publish RELEASE
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      version_override:
        description: 'Release version (e.g. 1.1.1). Leave blank to read from app/build.gradle.'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.7'
  GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true'

# ─────────────────────────────────────────────────────────────────────────────
# JOB 1 — LINT & UNIT TESTS  (always runs on every trigger)
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          gradle-home-cache-cleanup: false

      - name: Bootstrap Gradle wrapper
        run: |
          gradle wrapper --gradle-version ${{ env.GRADLE_VERSION }}
          chmod +x ./gradlew

      - name: Run lint
        run: ./gradlew lintDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: app/build/reports/lint-results-debug.html
          retention-days: 14

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14

# ─────────────────────────────────────────────────────────────────────────────
# JOB 2 — BUILD DEBUG APK  (PR checks only — cheap, no signing needed)
# ─────────────────────────────────────────────────────────────────────────────
  build-debug:
    name: Build Debug APK (PR check)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint-and-test
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          gradle-home-cache-cleanup: false

      - name: Bootstrap Gradle wrapper
        run: |
          gradle wrapper --gradle-version ${{ env.GRADLE_VERSION }}
          chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Stage APK
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk \
             "artifacts/Velora-debug-${SHORT_SHA}.apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: artifacts/Velora-debug-*.apk
          retention-days: 14

      - name: Comment APK size on PR
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'app/build/outputs/apk/debug/app-debug.apk';
            const bytes = fs.statSync(path).size;
            const mb = (bytes / 1024 / 1024).toFixed(2);
            const body = `### ✅ Build passed\n\n**Debug APK size:** ${mb} MB`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

# ─────────────────────────────────────────────────────────────────────────────
# JOB 3 — BUILD SIGNED RELEASE APK  (push + manual — shared by beta & release)
# ─────────────────────────────────────────────────────────────────────────────
  build-signed:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: lint-and-test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          gradle-home-cache-cleanup: false

      - name: Bootstrap Gradle wrapper
        run: |
          gradle wrapper --gradle-version ${{ env.GRADLE_VERSION }}
          chmod +x ./gradlew

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/app/velora-release.jks"

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/app/velora-release.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
            --stacktrace

      # AAB is only needed for the full manual release, but build it always
      # so the artifact is available if needed. Skipped on push to save time.
      - name: Build release AAB (Play Store)
        if: github.event_name == 'workflow_dispatch'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/app/velora-release.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
            --stacktrace

      - name: Resolve version name
        id: version
        run: |
          if [ -n "${{ inputs.version_override }}" ]; then
            echo "version=${{ inputs.version_override }}" >> "$GITHUB_OUTPUT"
          else
            VER=$(grep 'versionName' app/build.gradle | head -1 | grep -oP '"\K[^"]+')
            echo "version=${VER:-1.1.1}" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage artifacts
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          VER="${{ steps.version.outputs.version }}"
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk \
             "artifacts/Velora-v${VER}-release-${SHORT_SHA}.apk"
          # AAB only exists on manual dispatch
          if [ -f app/build/outputs/bundle/release/app-release.aab ]; then
            cp app/build/outputs/bundle/release/app-release.aab \
               "artifacts/Velora-v${VER}.aab"
          fi

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-apk
          path: artifacts/Velora-v*-release-*.apk
          retention-days: 90

      - name: Upload AAB artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: artifacts/Velora-v*.aab
          retention-days: 90

      - name: Clean up keystore
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/app/velora-release.jks"

# ─────────────────────────────────────────────────────────────────────────────
# JOB 4 — PUBLISH BETA  (auto, every successful push to main/develop)
#          Uses the signed release APK from job 3
# ─────────────────────────────────────────────────────────────────────────────
  publish-beta:
    name: Publish Beta Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-signed
    if: github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download signed release APK
        uses: actions/download-artifact@v4
        with:
          name: signed-release-apk
          path: beta-artifacts/

      - name: Compute beta tag
        id: beta_tag
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          BRANCH_SAFE="${{ github.ref_name }}"
          BRANCH_SAFE="${BRANCH_SAFE//\//-}"
          TAG="beta-${BRANCH_SAFE}-${SHORT_SHA}"
          echo "tag=${TAG}"           >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "branch_safe=${BRANCH_SAFE}" >> "$GITHUB_OUTPUT"

      - name: Generate commit list since last beta
        id: commits
        run: |
          PREV=$(git tag --sort=-creatordate | grep '^beta-' | head -1)
          if [ -z "$PREV" ]; then
            LOG=$(git log --oneline --no-merges -20)
          else
            LOG=$(git log --oneline --no-merges "${PREV}..HEAD")
          fi
          {
            echo "log<<DELIMITER"
            echo "$LOG"
            echo "DELIMITER"
          } >> "$GITHUB_OUTPUT"

      - name: Prune old beta tags for this branch (keep newest 5)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_SAFE="${{ steps.beta_tag.outputs.branch_safe }}"
          OLD=$(git tag --sort=-creatordate | grep "^beta-${BRANCH_SAFE}-" | tail -n +6)
          for t in $OLD; do
            git push origin --delete "$t" 2>/dev/null || true
          done

      - name: Publish beta pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.beta_tag.outputs.tag }}
          name: "🧪 Beta — ${{ steps.beta_tag.outputs.short_sha }} (${{ github.ref_name }})"
          prerelease: true
          body: |
            ## Velora Beta Build

            > **Automated beta build** from commit `${{ github.sha }}` on `${{ github.ref_name }}`.
            > Built with the signed release keystore. May contain incomplete features or bugs.

            ### Commits in this build
            ${{ steps.commits.outputs.log }}

            ---
            **Branch:** `${{ github.ref_name }}`
            **Commit:** `${{ github.sha }}`
            **Run:** ${{ github.run_id }}
          files: beta-artifacts/*.apk

# ─────────────────────────────────────────────────────────────────────────────
# JOB 5 — PUBLISH RELEASE  (manual workflow_dispatch only)
#          Uses the signed APK + AAB from job 3
# ─────────────────────────────────────────────────────────────────────────────
  publish-release:
    name: Publish Official Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-signed
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download signed release APK
        uses: actions/download-artifact@v4
        with:
          name: signed-release-apk
          path: release-artifacts/

      - name: Download release AAB
        uses: actions/download-artifact@v4
        with:
          name: release-aab
          path: release-artifacts/

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ inputs.version_override }}" ]; then
            echo "version=${{ inputs.version_override }}" >> "$GITHUB_OUTPUT"
          else
            VER=$(grep 'versionName' app/build.gradle | head -1 | grep -oP '"\K[^"]+')
            echo "version=${VER:-1.1.1}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate changelog since last stable release
        id: changelog
        run: |
          PREV=$(git tag --sort=-creatordate | grep -v '^beta-' | head -1)
          if [ -z "$PREV" ]; then
            LOG=$(git log --oneline --no-merges -30)
          else
            LOG=$(git log --oneline --no-merges "${PREV}..HEAD")
          fi
          {
            echo "log<<DELIMITER"
            echo "$LOG"
            echo "DELIMITER"
          } >> "$GITHUB_OUTPUT"

      - name: Publish official release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "Velora v${{ steps.version.outputs.version }}"
          prerelease: false
          body: |
            ## Velora v${{ steps.version.outputs.version }}

            ### What's new
            ${{ steps.changelog.outputs.log }}

            ---

            ### Installation
            Download the APK and install on Android 8.0+.
            Enable **Install from unknown sources** in Settings if prompted.

            | File | Description |
            |------|-------------|
            | `Velora-v*-release-*.apk` | Direct install on Android 8+ |
            | `Velora-v*.aab` | Google Play Console upload |

          files: |
            release-artifacts/*.apk
            release-artifacts/*.aab
